<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PickleScore 測試總覽（10 帳號）</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#080F1C;--card:#172F46;--line:#466783;--t:#F8FAFC;--m:#B7CBE0;--y:#FDE047}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);background:#102A43}
  header b{color:var(--y);font-size:16px}
  header .m{color:var(--m);font-size:13px}
  input{background:#0b1a2c;border:1px solid var(--line);color:var(--t);border-radius:8px;padding:7px 10px;font-size:14px;width:150px}
  button{background:var(--y);color:#102A43;border:0;border-radius:8px;padding:7px 12px;font-weight:700;font-size:14px;cursor:pointer}
  button.g{background:transparent;color:var(--t);border:1px solid var(--line)}
  select{background:#0b1a2c;color:var(--t);border:1px solid var(--line);border-radius:8px;padding:6px}
  #grid{display:grid;padding:6px;justify-content:center}
  .cell{position:relative;align-self:start;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000}
  .cell.on{border-color:var(--y)}
  .tag{position:absolute;left:0;top:0;z-index:2;background:rgba(8,15,28,.85);color:var(--y);font-size:12px;font-weight:700;padding:2px 7px;border-bottom-right-radius:8px;pointer-events:none}
  .cell iframe{border:0;transform-origin:0 0;display:block;background:#102A43}
</style>
</head>
<body>
<header>
  <b>測試總覽</b>
  <span class="m">10 個測試帳號同一個畫面，每一格都能直接點。</span>
  <input type="password" id="pw" placeholder="測試密碼" autocomplete="current-password">
  <button id="all">全部登入</button>
  <span class="m">每列</span>
  <select id="cols"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>
  <span class="m">格</span>
  <button class="g" id="reload">全部重新整理</button>
  <span class="m" id="st"></span>
</header>
<div id="grid"></div>
<script>
const N = 10, W = 390, H = 844;
const grid = document.getElementById('grid');
const frames = [];
for (let i = 1; i <= N; i++) {
  const c = document.createElement('div'); c.className = 'cell';
  c.innerHTML = '<div class="tag">測試' + String(i).padStart(2, '0') + '</div>';
  const f = document.createElement('iframe');
  f.src = './?test=' + i; f.width = W; f.height = H; f.title = '測試' + i;
  c.appendChild(f); grid.appendChild(c); frames.push(f);
  c.addEventListener('pointerdown', () => { document.querySelectorAll('.cell').forEach(x => x.classList.remove('on')); c.classList.add('on'); });
}
let SC = 0.5;
function fit() {
  const cols = +document.getElementById('cols').value, gap = 6;
  const cw = Math.floor((document.documentElement.clientWidth - 12 - gap * (cols - 1)) / cols);
  SC = cw / W;                                            // 填滿寬度
  grid.style.gap = gap + 'px';
  grid.style.gridTemplateColumns = 'repeat(' + cols + ',' + cw + 'px)';
  document.querySelectorAll('.cell').forEach(c => c.style.width = cw + 'px');
  frames.forEach(f => f.style.transform = 'scale(' + SC + ')');
  grow();
}
// 每一格完整顯示：iframe 高度跟著內容長，不在格子裡捲動，整頁用右邊的卷軸
function grow() {
  frames.forEach(f => {
    let h = H;
    try { const d = f.contentDocument; if (d && d.body) h = Math.max(H, d.body.scrollHeight, d.documentElement.scrollHeight); } catch (e) {}
    if (+f.dataset.h !== h) {
      f.dataset.h = h; f.height = h;
      try { f.contentDocument.documentElement.style.overflow = 'hidden'; } catch (e) {}
    }
    f.parentNode.style.height = Math.ceil(h * SC) + 'px';
  });
}
setInterval(grow, 700);
addEventListener('resize', fit); document.getElementById('cols').onchange = fit;
try { const v = localStorage.getItem('ps-test-cols'); if (v) document.getElementById('cols').value = v; } catch (e) {}
document.getElementById('cols').addEventListener('change', e => { try { localStorage.setItem('ps-test-cols', e.target.value); } catch (x) {} });
fit();

function frameState(f) {
  try {
    const d = f.contentDocument; if (!d) return 'wait';
    if (d.getElementById('tpw')) return 'form';
    const v = d.getElementById('view'); if (v && v.innerText.trim() && !/載入中/.test(v.innerText)) return 'in';
  } catch (e) {}
  return 'wait';
}
document.getElementById('all').onclick = async () => {
  const pw = document.getElementById('pw').value, st = document.getElementById('st');
  if (!pw) { st.textContent = '請先輸入密碼'; return; }
  document.getElementById('pw').value = '';
  const sent = new Set();
  for (let t = 0; t < 30; t++) {
    frames.forEach((f, i) => {
      if (sent.has(i) || frameState(f) !== 'form') return;
      try { const d = f.contentDocument; d.getElementById('tpw').value = pw; d.querySelector('[data-act=tlogin]').click(); sent.add(i); } catch (e) {}
    });
    const inN = frames.filter(f => frameState(f) === 'in').length;
    st.textContent = '已登入 ' + inN + ' / ' + N + (inN < N ? '…' : '');
    if (inN === N) return;
    await new Promise(r => setTimeout(r, 500));
  }
  const bad = frames.map((f, i) => frameState(f) === 'in' ? null : '測試' + String(i + 1).padStart(2, '0')).filter(Boolean);
  st.textContent = bad.length ? '沒登入成功：' + bad.join('、') + '（密碼對嗎？）' : '已登入 10 / 10';
};
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('all').click(); });
document.getElementById('reload').onclick = () => frames.forEach(f => { try { f.contentWindow.location.reload(); } catch (e) {} });
</script>
</body>
</html>
