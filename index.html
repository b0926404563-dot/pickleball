<script>
{
const $=s=>document.querySelector(s);

const two=n=>String(n).padStart(2,'0');
const D=t=>{const d=new Date(t);return`${d.getMonth()+1}/${d.getDate()}（${'日一二三四五六'[d.getDay()]}）`};
const HM=t=>{const d=new Date(t);return two(d.getHours())+':'+two(d.getMinutes())};
const pk=(x,y)=>x<y?x+'|'+y:y+'|'+x;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const SP={pickleball:'匹克球',badminton:'羽球'};
const RS={pickleball:'dupr',badminton:'bdupr'},RK=2;

function modal(html){$('#mbox').innerHTML=html;$('#modal').classList.add('show');const i=$('#mbox input');if(i)setTimeout(()=>i.focus(),50)}

const errMsg=e=>{const m=(e&&(e.message||e.error_description))||'發生錯誤，請稍後再試';if(/duplicate key.*nickname/.test(m))return '這個暱稱已經有人用了';if(/duplicate key.*name/.test(m))return '俱樂部裡已經有同名的球員';if(/Failed to fetch|NetworkError/.test(m))return '網路連線不穩，請再試一次';return m};
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('已複製')}catch(e){modal(`<h3>請長按複製</h3><textarea readonly>${esc(text)}</textarea><div class="row" style="margin-top:12px"><button class="btn" data-act="close">關閉</button></div>`)}}

/* ---------- 實力：加權 Ridge（得分比 logit，校正隊友與對手，起始分數當先驗，90 天半衰期） ---------- */
function invert(M){const n=M.length,a=M.map((r,i)=>[...r,...r.map((_,j)=>i===j?1:0)]);
  for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(a[r][c])>Math.abs(a[p][c]))p=r;[a[c],a[p]]=[a[p],a[c]];
    const d=a[c][c]||1e-9;for(let j=0;j<2*n;j++)a[c][j]/=d;
    for(let r=0;r<n;r++)if(r!==c){const f=a[r][c];if(f)for(let j=0;j<2*n;j++)a[r][j]-=f*a[c][j]}}
  return a.map(r=>r.slice(n))}
function ability(sport,onlySid,lam=3){
  const now=Date.now(),rows=[],cnt={},f=RS[sport];
  games.forEach(g=>{if(g.status!=='confirmed'||g.a.length!==g.b.length)return;const s=sessById(g.session_id);if(!s||s.sport!==sport||(onlySid&&s.id!==onlySid))return;
    const t=new Date(g.ended_at||s.started_at).getTime(),w=Math.pow(.5,Math.max(0,now-t)/864e5/90);
    rows.push({a:g.a,b:g.b,y:Math.log((g.sa+.5)/(g.sb+.5)),w});[...g.a,...g.b].forEach(id=>cnt[id]=(cnt[id]||0)+1)});
  const ids=Object.keys(cnt).filter(id=>P(id)),n=ids.length,ix={};if(!n)return{};ids.forEach((id,i)=>ix[id]=i);
  const base=3,b0=ids.map(()=>0);  // 每個人都從 3.000 起算
  const A=ids.map((_,i)=>ids.map((_,j)=>i===j?lam:0)),v=b0.map(x=>lam*x);
  rows.forEach(r=>{const xs=[...r.a.filter(id=>id in ix).map(id=>[ix[id],1]),...r.b.filter(id=>id in ix).map(id=>[ix[id],-1])];
    xs.forEach(([i,xi])=>{v[i]+=r.w*xi*r.y;xs.forEach(([j,xj])=>A[i][j]+=r.w*xi*xj)})});
  const inv=invert(A),beta=ids.map((_,i)=>inv[i].reduce((s,x,j)=>s+x*v[j],0));
  let rss=0,sw=0;rows.forEach(r=>{const p=r.a.reduce((s,id)=>s+(id in ix?beta[ix[id]]:0),0)-r.b.reduce((s,id)=>s+(id in ix?beta[ix[id]]:0),0);rss+=r.w*(r.y-p)*(r.y-p);sw+=r.w});
  const s2=Math.max(.25,sw>1?rss/sw:.25),out={};
  ids.forEach((id,i)=>out[id]={b:beta[i],sd:Math.sqrt(Math.max(0,inv[i][i]*s2)),g:cnt[id],r:base+RK*beta[i]});return out;
}
function priorB(){return()=>0}

/* ---------- 排賽：出賽少的先上、上一輪休息的優先、避免重複搭檔/對手/同四人、兩隊實力接近 ---------- */
function counts(s,gl){
  const c={played:{},partner:{},opp:{},quad:{},lastSat:new Set()};
  gl.forEach(g=>{
    [...g.a,...g.b].forEach(id=>c.played[id]=(c.played[id]||0)+1);
    [g.a,g.b].forEach(t=>{if(t.length===2){const k=pk(t[0],t[1]);c.partner[k]=(c.partner[k]||0)+1}});
    g.a.forEach(x=>g.b.forEach(y=>{const k=pk(x,y);c.opp[k]=(c.opp[k]||0)+1}));
    const q=[...g.a,...g.b].sort().join('|');c.quad[q]=(c.quad[q]||0)+1;
  });
  const last=Math.max(0,...gl.map(g=>g.rn));
  if(last){const inLast=new Set(gl.filter(g=>g.rn===last).flatMap(g=>[...g.a,...g.b]));playing(s).forEach(id=>{if(!inLast.has(id))c.lastSat.add(id)})}
  return c;
}
function makeRound(s,gl,rn,R){
  const k=per(s),cu=courtsUsed(s);if(cu<1)return null;
  const c=counts(s,gl);
  const order=shuffle(playing(s)).sort((x,y)=>((c.played[x]||0)-(c.played[y]||0))||(c.lastSat.has(y)-c.lastSat.has(x)));
  const play=order.slice(0,cu*k);
  let best=null,bc=Infinity;
  for(let t=0;t<500;t++){
    const sh=shuffle(play),gs=[];let cost=0;
    for(let ci=0;ci<cu;ci++){
      const g=sh.slice(ci*k,ci*k+k),a=g.slice(0,k/2),b=g.slice(k/2);
      if(k===4){cost+=10*((c.partner[pk(a[0],a[1])]||0)+(c.partner[pk(b[0],b[1])]||0));cost+=6*(c.quad[[...a,...b].sort().join('|')]||0)}
      a.forEach(x=>b.forEach(y=>cost+=(k===4?2:5)*(c.opp[pk(x,y)]||0)));
      const d=a.reduce((x,id)=>x+R(id),0)-b.reduce((x,id)=>x+R(id),0);cost+=30*d*d;
      gs.push({a,b});
    }
    if(cost<bc){bc=cost;best=gs}
  }
  return best.map((g,i)=>({session_id:s.id,club_id:s.club_id,rn,court:i+1,a:g.a,b:g.b}));
}
function planRounds(s){
  const gl=gamesOf(s.id).slice(),openR=new Set(gl.filter(g=>g.status==='open').map(g=>g.rn));
  const AB=ability(s.sport),pr=priorB(s.sport),R=id=>AB[id]?AB[id].b:pr(id);
  let rn=Math.max(0,...gl.map(g=>g.rn)),need=2-openR.size;const rows=[];
  while(need-->0){const r=makeRound(s,gl,++rn,R);if(!r)break;rows.push(...r);gl.push(...r)}
  return rows;
}

    const [pl,mb,ss,gm]=await Promise.all([fetchAll('players',club.id,'created_at',true),fetchAll('members',club.id,'joined_at',true),fetchAll('sessions',club.id,'started_at',false),fetchAll('games',club.id,'created_at',true)]);

    if(e2)toast(errMsg(e2));else{await loadClubs();toast('已加入俱樂部');if(!rq)return openClub(cid)}}
  if(rq){const {data:rs}=await sb.from('sessions').select('id,club_id,status').eq('id',rq).maybeSingle();
    if(rs&&rs.status!=='done'&&myClubs.some(c=>c.id===rs.club_id)){setRoom(rs.id);UI.tab='games';ls.set('pbc-tab','games');return openClub(rs.club_id)}

function gameCard(g,s){
  const me=myP(),mid=me&&me.id,side=sideOf(g,mid),ed=UI.edit===g.id;
  const st={open:'待比賽',pending:'待確認',confirmed:'已確認'}[g.status];
  const inputs=`<div class="inrow"><input type="number" inputmode="numeric" min="0" max="99" id="xa-${g.id}" aria-label="A 隊分數" placeholder="A" value="${ed&&g.sa!=null?g.sa:''}"><input type="number" inputmode="numeric" min="0" max="99" id="xb-${g.id}" aria-label="B 隊分數" placeholder="B" value="${ed&&g.sb!=null?g.sb:''}"><button class="btn pri" data-act="report" data-id="${g.id}">送出</button></div>`;
  let body='';
  if(g.status==='open'&&!ed&&isLive(s)){const [x,y]=scoreOf(g),w=winner(s,x,y),cs=canScore(g,s);
    body=`<div class="lv2"><div class="lvs a"><div class="tm">${team(g.a,mid)}</div><div class="n">${x}</div>${cs?`<button class="plus a" data-act="pt" data-id="${g.id}" data-v="a" aria-label="A 隊得 1 分">A +1</button>`:''}</div>
      <div class="lvs b"><div class="tm">${team(g.b,mid)}</div><div class="n">${y}</div>${cs?`<button class="plus b" data-act="pt" data-id="${g.id}" data-v="b" aria-label="B 隊得 1 分">B +1</button>`:''}</div></div>
      ${w?`<div class="winbox"><span>🏆 ${w==='a'?'A':'B'} 隊拿下這場 ${x}:${y}</span>${cs?`<button class="btn sm" data-act="lvSubmit" data-id="${g.id}">送出比分</button>`:''}</div>`:''}
      ${cs?`<div class="lvbar"><button class="btn sm" data-act="ptUndo" data-id="${g.id}" ${x+y?'':'disabled'}>↶ 復原上一分</button>${w?'':`<button class="btn sm" data-act="lvSubmit" data-id="${g.id}" ${x!==y?'':'disabled'}>提前結束、送出 ${x}:${y}</button>`}<button class="btn sm" data-act="edit" data-id="${g.id}">改用手動填</button></div>`:'<p class="mute" style="margin:8px 0 0">由場上球員或房主記分。</p>'}`}
  else if(g.status==='open'||ed)body=inputs+(ed?`<div class="row" style="margin-top:6px"><button class="btn sm" data-act="editOff">取消修改</button></div>`:'');
  else if(g.status==='pending')body=`<div class="note">${esc(unameByUid(g.reported_by))} 回報，等待${g.reported_side?'對手':''}確認</div><div class="row" style="margin-top:8px">${canConfirm(g)&&g.reported_by!==user.id?`<button class="btn go sm" data-act="confirm" data-id="${g.id}">比分正確，確認</button>`:''}<button class="btn sm" data-act="edit" data-id="${g.id}">比分不對，修改</button></div>`;
  else body=`<div class="note">已由 ${esc(unameByUid(g.confirmed_by))} 確認${isAdmin()?` · <button class="btn sm" data-act="edit" data-id="${g.id}" style="min-height:30px">修改</button>`:''}</div>`;

/* ---------- 排名 ---------- */
function statsOf(gl){
  const ps={};
  gl.forEach(g=>[['a','b'],['b','a']].forEach(([m,o])=>{const my=g['s'+m],ot=g['s'+o],win=my>ot;
    g[m].forEach(id=>{const x=ps[id]||(ps[id]={id,g:0,w:0,l:0,pf:0,pa:0});x.g++;win?x.w++:x.l++;x.pf+=my;x.pa+=ot})}));
  return Object.values(ps).filter(x=>P(x.id)).sort((x,y)=>(y.w/y.g-x.w/x.g)||(y.w-x.w)||((y.pf-y.pa)-(x.pf-x.pa)));
}
const meRow=id=>{const m=myP();return m&&m.id===id?'me':''};
function abilityCard(sport,sid,title){
  const AB=ability(sport,sid),arr=Object.entries(AB).map(([id,v])=>Object.assign({id},v)).sort((x,y)=>y.r-x.r);
  if(!arr.length)return '';
  const rel=v=>v.sd<.13?'穩定':v.sd<.2?'普通':'參考';
  const sc=b=>{const p=1/(1+Math.exp(-b));return p>=.5?'11:'+Math.round(11*(1-p)/p):Math.round(11*p/(1-p))+':11'};
  return `<div class="card"><h2>${title}</h2><table><thead><tr><th></th><th>球友</th><th>分數</th><th>對平均</th><th>場</th><th>可信度</th></tr></thead><tbody>
    ${arr.map((v,i)=>`<tr class="r${i+1} ${meRow(v.id)}"><td><span class="rk">${i+1}</span></td><td>${nm(v.id)}</td><td class="num ${v.b>.005?'pos':v.b<-.005?'neg':''}">${v.r.toFixed(3)}</td><td class="num">${sc(v.b)}</td><td class="num">${v.g}</td><td>${rel(v)}</td></tr>`).join('')}</tbody></table>
    <p class="mute" style="margin-bottom:0">同時校正隊友和對手的強弱：強隊對弱隊只贏一點點會扣分，弱隊輸強隊輸得少反而加分。分數仿 DUPR 尺度，每個人都從 3.000 起算；「對平均」是搭一位平均球友、對上兩位平均球友時的預估比分。可信度「參考」代表場次還少。</p></div>`;
}
function winCard(gl,title){
  const st=statsOf(gl);if(!st.length)return '';
  return `<div class="card"><h2>${title}</h2><table><thead><tr><th></th><th>球友</th><th>場</th><th>勝-負</th><th>勝率</th><th>分差</th></tr></thead><tbody>
    ${st.map((x,i)=>{const d=x.pf-x.pa;return `<tr class="r${i+1} ${meRow(x.id)}"><td><span class="rk">${i+1}</span></td><td>${nm(x.id)}</td><td class="num">${x.g}</td><td class="num">${x.w}-${x.l}</td><td class="num">${Math.round(100*x.w/x.g)}%</td><td class="num ${d>0?'pos':d<0?'neg':''}">${d>0?'+':''}${d}</td></tr>`}).join('')}</tbody></table></div>`;
}
function dualCard(){
  const A={pickleball:ability('pickleball'),badminton:ability('badminton')};
  const rows=players.filter(p=>!p.hidden&&(A.pickleball[p.id]||A.badminton[p.id]));
  if(!rows.length)return '';
  const cell=(p,k)=>{const a=A[k][p.id];return a?`<b>${a.r.toFixed(3)}</b><br><span class="mute" style="font-size:12px">${a.g} 場</span>`:'<span class="mute">3.000</span>'};
  const key=p=>{const a=A.pickleball[p.id];return a?a.r:3};
  return `<div class="card"><h2>雙項分數</h2><table class="l1"><thead><tr><th>球友</th><th>匹克球</th><th>羽球</th></tr></thead><tbody>
    ${rows.sort((x,y)=>key(y)-key(x)).map(p=>`<tr class="${meRow(p.id)}"><td>${esc(p.name)}</td><td class="num">${cell(p,'pickleball')}</td><td class="num">${cell(p,'badminton')}</td></tr>`).join('')}</tbody></table>
    <p class="mute" style="margin-bottom:0">兩種球各算各的，互不影響，大家都從 3.000 開始。這是俱樂部自己的分數，不是官方 DUPR。</p></div>`;
}

function report(s){

    case 'close':closeModal();return;
    case 'avEdit':UI.avDraft=Object.assign({},avOf(user.id));UI.avScroll=0;avEditor();return;
    case 'av':{const m=$('#mbox');UI.avScroll=m?m.scrollTop:0;const n=$('#avn');if(n)UI.avDraft.n=n.value.replace(/\D/g,'').slice(0,2);UI.avDraft[t.dataset.k]=+v;avEditor();return}
    case 'avRand':{const m=$('#mbox');UI.avScroll=m?m.scrollTop:0;const r=k=>Math.floor(Math.random()*AVP[k].length);
      UI.avDraft=Object.assign(UI.avDraft,{s:r('s'),h:r('h'),hc:r('hc'),sh:r('sh'),p:r('p'),hw:r('hw'),hwc:r('hwc'),e:r('e')});avEditor();return}
    case 'avSave':{const n=$('#avn');const av=Object.assign({},UI.avDraft,{n:n?n.value.replace(/\D/g,'').slice(0,2):''});t.disabled=true;
      const {data,error}=await sb.from('profiles').update({avatar:av}).eq('id',user.id).select().single();if(error){toast(errMsg(error));t.disabled=false;return}
      profile=data;avatars[user.id]=av;closeModal();toast('換裝完成！');break}
    case 'newRoom':UI.create=!UI.create;render();if(UI.create){const c=$('#createCard');if(c)c.scrollIntoView({behavior:'smooth',block:'start'})}return;
    case 'quick':{const me=myP(),w=openRooms().filter(x=>x.status==='lobby'&&x.sport===UI.form.sport&&!(me&&inRoom(x,me.id))).sort((x,y)=>playing(y).length-playing(x).length)[0];
      if(!w){toast('沒有等待中的房間，開一間吧！');return}t.disabled=true;await rpc('room_join',{sid:w.id});setRoom(w.id);UI.tab='games';ls.set('pbc-tab','games');await loadClub();toast('已進入「'+roomName(w)+'」');scrollTo(0,0);return}
    case 'google':{const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname+location.search}});if(error)toast(errMsg(error));return}
    case 'logout':closeModal();if(chan){sb.removeChannel(chan);chan=null}club=null;await sb.auth.signOut();return;
    case 'saveNick':{const n=$('#nick').value.trim();if(!n){toast('請輸入暱稱');return}
      const row={id:user.id,nickname:n};
      const {data,error}=await sb.from('profiles').upsert(row).select().single();if(error){toast(errMsg(error));return}
      profile=data;closeModal();toast('已儲存');if(UI.view==='nick')return afterAuth();render();return}
    case 'editMe':modal(`<h3>我的帳號</h3><div class="field"><label for="nick">暱稱</label><input type="text" id="nick" maxlength="20" value="${esc(profile.nickname)}"></div>
      <p class="mute" style="margin-top:0">這是加入新俱樂部時的預設名稱；在各俱樂部的顯示名稱，到該俱樂部的「成員」頁修改。</p><div class="row"><button class="btn pri" data-act="saveNick">儲存</button><button class="btn" data-act="close">取消</button></div>`);return;
    case 'toClubs':if(chan){sb.removeChannel(chan);chan=null}club=null;ls.set('pbc-club','');await loadClubs();UI.view='clubs';break;
    case 'openClub':return openClub(id);
    case 'join':{const c=$('#code').value.trim();if(!c)return;const cid=await rpc('join_club',{p_code:c});await loadClubs();toast('已加入');return openClub(cid)}
    case 'create':{const n=$('#cname').value.trim();if(!n){toast('請輸入俱樂部名稱');return}const cid=await rpc('create_club',{p_name:n});await loadClubs();toast('俱樂部建立好了！到「成員」複製邀請連結給朋友');UI.tab='members';return openClub(cid)}
    case 'fSport':UI.form.sport=v;UI.form.target=v==='badminton'?21:11;saveForm();break;
    case 'fMode':UI.form.mode=v;saveForm();break;
    case 'fCourts':UI.form.courts=+v;saveForm();break;
    case 'fTarget':UI.form.target=+v;saveForm();break;
    case 'fScore':UI.form.score=v;saveForm();break;
    case 'fWin2':UI.form.win2=v==='1';saveForm();break;
    case 'pt':{const g=games.find(x=>x.id===id),cid=(crypto.randomUUID?crypto.randomUUID():([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^Math.random()*16>>c/4).toString(16)));
      const x=liveEv[id]||(liveEv[id]=[0,0]);x[v==='a'?0:1]++;render();if(navigator.vibrate)navigator.vibrate(15);
      try{await rpc('score_point',{gid:id,sd:v,cid})}catch(err){x[v==='a'?0:1]--;render();toast(errMsg(err))}return}
    case 'ptUndo':t.disabled=true;await rpc('score_undo',{gid:id});await loadEvents();break;
    case 'lvSubmit':{const [x,y]=scoreOf({id});if(x===y){toast('比分不能平手');return}t.disabled=true;
      await rpc('report_score',{gid:id,x,y});toast(isAdmin()?'已送出':'已送出，等對手確認');await loadClub();await ensureRounds();return}
    case 'placePick':UI.form.place=v;saveForm();break;
    case 'enter':setRoom(id);UI.tab='games';ls.set('pbc-tab','games');scrollTo(0,0);break;
    case 'rjoin':{t.disabled=true;await rpc('room_join',{sid:id});setRoom(id);UI.tab='games';ls.set('pbc-tab','games');await loadClub();
      const x=sessById(id);if(x&&x.status==='live'){await ensureRounds();toast('已加入，下一輪起會排你上場')}else toast('已進入房間');scrollTo(0,0);return}
    case 'rleave':{t.disabled=true;await rpc('room_leave',{sid:id});await loadClub();toast('已離開房間');UI.tab='today';ls.set('pbc-tab','today');break}
    case 'createRoom':{const me=myP();if(!me)return;const f=UI.form,pl=$('#place');if(pl)f.place=pl.value.trim();saveForm();
      const n=($('#rname')||{}).value;t.disabled=true;
      const row={club_id:club.id,sport:f.sport,cfg:{mode:f.mode,courts:f.courts,target:f.target,score:f.score||'final',win2:!!f.win2},place:f.place||null,name:(n||'').trim()||null,status:'lobby',present:[]};
      const {data,error}=await sb.from('sessions').insert(row).select().single();if(error){toast(errMsg(error));t.disabled=false;return}
      await rpc('room_join',{sid:data.id});setRoom(data.id);UI.create=false;UI.tab='games';ls.set('pbc-tab','games');await loadClub();toast('房間開好了！把連結貼到群組叫大家進房');scrollTo(0,0);return}
    case 'copyRoom':{const x=sessById(id);copyText(`🏓 ${roomName(x)}（${SP[x.sport]}）\n快進房：${location.origin+location.pathname}?join=${club.join_code}&room=${x.id}`);return}
    case 'rCourts':{const r=room();if(!r)return;await saveSess(r,{cfg:Object.assign({},r.cfg,{courts:+v})});if(r.status==='live')toast('下一批新排的輪次會用新的場地數');return}
    case 'kick':{const r=room();if(!r||!isHost(r))return;
      if(r.status==='lobby')await saveSess(r,{present:r.present.filter(x=>x!==id)});
      else{const aw=r.away||[];await saveSess(r,{away:aw.includes(id)?aw.filter(x=>x!==id):[...aw,id]});toast('已更新，按下方「重排」套用到還沒打的場次')}return}
    case 'rstart':{const r=room();if(!r)return;t.disabled=true;await saveSess(r,{status:'live',started_at:new Date().toISOString()});await ensureRounds();toast('比賽開始！');return}
    case 'rcloseAsk':modal(`<h3>解散房間？</h3><p>房間會關閉，房內的人回到大廳。</p><div class="row"><button class="btn warn" data-act="rclose">解散</button><button class="btn" data-act="close">取消</button></div>`);return;
    case 'rclose':{closeModal();const r=room();if(!r)return;await saveSess(r,{status:'done',ended_at:new Date().toISOString()});setRoom(null);UI.tab='today';ls.set('pbc-tab','today');await loadClub();toast('房間已解散');return}
    case 'reshuffleAsk':modal(`<h3>重排還沒打的場次</h3><p>依照現在的出席名單重新分組。已經填過比分的場次不受影響。</p>
      <div class="row"><button class="btn pri" data-act="reshuffle" data-v="later">只重排後面的輪次</button><button class="btn" data-act="reshuffle" data-v="all">連現在這輪一起重排</button><button class="btn" data-act="close">取消</button></div>`);return;
    case 'reshuffle':{closeModal();if(!s)return;const gl=gamesOf(s.id).filter(g=>g.status==='open');if(!gl.length){await ensureRounds();return}
      const first=Math.min(...gl.map(g=>g.rn)),del=gl.filter(g=>v==='all'||g.rn>first).map(g=>g.id);
      if(del.length){const {error}=await sb.from('games').delete().in('id',del).eq('status','open');if(error){toast(errMsg(error));return}games=games.filter(g=>!del.includes(g.id))}
      await ensureRounds();toast('已重新分組');return}
    case 'endAsk':modal(`<h3>結束比賽、關閉房間？</h3><p>還沒打的場次會清掉；已填的比分會保留，等待確認的之後還是可以確認。</p><div class="row"><button class="btn warn" data-act="end">結束</button><button class="btn" data-act="close">取消</button></div>`);return;
    case 'end':{closeModal();const del=gamesOf(s.id).filter(g=>g.status==='open').map(g=>g.id);
      if(del.length)await sb.from('games').delete().in('id',del).eq('status','open');
      await saveSess(s,{status:'done',ended_at:new Date().toISOString()});setRoom(null);UI.tab='records';UI.detail=s.id;ls.set('pbc-tab','records');await loadClub();toast('比賽結束，戰績已存檔');return}
    case 'report':{const x=parseInt($('#xa-'+id).value),y=parseInt($('#xb-'+id).value);
      if(isNaN(x)||isNaN(y)){toast('請填兩隊的分數');return}if(x===y){toast('比分不能平手');return}
      t.disabled=true;await rpc('report_score',{gid:id,x,y});UI.edit=null;toast(isAdmin()?'已送出':'已送出，等對手確認');await loadClub();await ensureRounds();return}
    case 'confirm':t.disabled=true;await rpc('confirm_score',{gid:id});toast('已確認');await loadClub();return;
    case 'edit':UI.edit=id;break;
    case 'editOff':UI.edit=null;break;
    case 'rv':UI.rankView=v;break;
    case 'rs':UI.rankSport=v;break;
    case 'detail':UI.detail=id;scrollTo(0,0);break;
    case 'back':UI.detail=null;break;
    case 'copy':copyText(report(sessById(id)));return;
    case 'delAsk':modal(`<h3>刪除這次活動？</h3><p>這次所有比分都會一起刪除，排名和實力分數會重算，無法復原。</p><div class="row"><button class="btn warn" data-act="del" data-id="${id}">刪除</button><button class="btn" data-act="close">取消</button></div>`);return;
    case 'del':{closeModal();const {error}=await sb.from('sessions').delete().eq('id',id);if(error){toast(errMsg(error));return}UI.detail=null;await loadClub();toast('已刪除');return}
    case 'copyLink':copyText(location.origin+location.pathname+'?join='+club.join_code);return;
    case 'saveMine':{const me=myP();if(!me)return;const n=$('#myname').value.trim();if(!n){toast('名稱不能空白');return}
      const patch={name:n};const {error}=await sb.from('players').update(patch).eq('id',me.id);if(error){toast(errMsg(error));return}
      Object.assign(me,patch);toast('已儲存');break}
    case 'pEdit':{const p=P(id);if(!p)return;const m=p.user_id&&members.find(x=>x.user_id===p.user_id);
      modal(`<h3>編輯球員</h3><div class="field"><label for="pn">名稱</label><input type="text" id="pn" maxlength="24" value="${esc(p.name)}"></div>
        <div class="row"><button class="btn pri" data-act="pSave" data-id="${id}">儲存</button><button class="btn" data-act="pHide" data-id="${id}">${p.hidden?'取消隱藏':'從名單隱藏'}</button>
        ${role==='owner'&&m&&m.role!=='owner'?`<button class="btn" data-act="pRole" data-id="${id}">${m.role==='admin'?'取消幹部':'設為幹部'}</button>`:''}<button class="btn" data-act="close">取消</button></div>
        <p class="mute">隱藏不會刪掉戰績，只是開場時不顯示。</p>`);return}
    case 'pSave':{const n=$('#pn').value.trim();if(!n)return;const patch={name:n};
      const {error}=await sb.from('players').update(patch).eq('id',id);if(error){toast(errMsg(error));return}closeModal();await loadClub();toast('已儲存');return}
    case 'pHide':{const p=P(id);const {error}=await sb.from('players').update({hidden:!p.hidden}).eq('id',id);if(error){toast(errMsg(error));return}closeModal();await loadClub();return}
    case 'pRole':{const p=P(id),m=members.find(x=>x.user_id===p.user_id);const {error}=await sb.from('members').update({role:m.role==='admin'?'member':'admin'}).eq('club_id',club.id).eq('user_id',p.user_id);
      if(error){toast(errMsg(error));return}closeModal();await loadClub();toast('已更新');return}
    case 'claimAsk':modal(`<h3>「${nm(id)}」是你嗎？</h3><p>認領後，這位臨時球員過去的戰績都會接到你的帳號。</p><div class="row"><button class="btn pri" data-act="claim" data-id="${id}">是我，認領</button><button class="btn" data-act="close">取消</button></div>`);return;
    case 'claim':closeModal();await rpc('claim_player',{pid:id});await loadClub();toast('認領成功');return;
    default:return;
  }}catch(err){toast(errMsg(err));t.disabled=false;return}
  render();
});
document.addEventListener('change',e=>{
  const tg=e.target;
  if(tg.id==='tgt'){const x=parseInt(tg.value);if(x>0&&x<100){UI.form.target=x;saveForm();setTimeout(render,0)}}
  if(tg.id==='place'){UI.form.place=tg.value.trim();saveForm()}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing)return;const id=e.target.id;
  const go=sel=>{e.preventDefault();const b=$(sel);if(b)b.click()};
  if(id==='code')go('[data-act=join]');else if(id==='cname')go('[data-act=create]');
  else if(id==='nick')go('[data-act=saveNick]');else if(id==='rname')e.target.blur();else if(id==='tgt'||id==='place')e.target.blur();
  else if(id.startsWith('xa-')){e.preventDefault();const b=$('#xb-'+id.slice(3));if(b)b.focus()}
  else if(id.startsWith('xb-'))go(`[data-act=report][data-id="${id.slice(3)}"]`);
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* ---------- 啟動 ---------- */
if(!SUPABASE_URL||!SUPABASE_KEY||!window.supabase){UI.view='setup';render()}
else{
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,detectSessionInUrl:true,flowType:'pkce'}});
  let booted=false;
  sb.auth.onAuthStateChange((ev,session)=>{const u=session?session.user:null;
    if(!booted||(u&&u.id)!==(user&&user.id)){booted=true;user=u;setTimeout(afterAuth,0)}});
}
}
</script>
</body>
</html>
