<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const two=n=>String(n).padStart(2,'0');
const D=t=>{const d=new Date(t);return`${d.getMonth()+1}/${d.getDate()}（${'日一二三四五六'[d.getDay()]}）`};
const HM=t=>{const d=new Date(t);return two(d.getHours())+':'+two(d.getMinutes())};
const pk=(x,y)=>x<y?x+'|'+y:y+'|'+x;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const SP={pickleball:'匹克球',badminton:'羽球'};
const RS={pickleball:'dupr',badminton:'bdupr'},RK=2;
const LSP=(()=>{const v=parseInt(new URLSearchParams(location.search).get('test'));return v>=1&&v<=20?'t'+v+'-':''})();
const ls={get:k=>{try{return localStorage.getItem(LSP+k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(LSP+k,v)}catch(e){}}};
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2400)}
function modal(html){$('#mbox').innerHTML=html;$('#modal').classList.add('show');const i=$('#mbox input');if(i)setTimeout(()=>i.focus(),50)}

const errMsg=e=>{const m=(e&&(e.message||e.error_description))||'發生錯誤，請稍後再試';if(/duplicate key.*nickname/.test(m))return '這個暱稱已經有人用了';if(/duplicate key.*name/.test(m))return '俱樂部裡已經有同名的球員';if(/Failed to fetch|NetworkError/.test(m))return '網路連線不穩，請再試一次';return m};
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('已複製')}catch(e){modal(`<h3>請長按複製</h3><textarea readonly>${esc(text)}</textarea><div class="row" style="margin-top:12px"><button class="btn" data-act="close">關閉</button></div>`)}}

/* ---------- 狀態 ---------- */
let liveEv={},avatars={},sb=null,user=null,profile=null,myClubs=[],club=null,role=null,members=[],players=[],sessions=[],games=[],chan=null,loadingClub=false;
const UI={room:ls.get('pbc-room')||null,view:'boot',tab:ls.get('pbc-tab')||'today',rankView:'today',rankSport:'pickleball',detail:null,sel:null,edit:null,gen:false,
  form:Object.assign({sport:'pickleball',mode:'doubles',courts:1,target:11,place:'',score:'live',win2:true,dur:120,serve:'rally'},(()=>{try{return JSON.parse(ls.get('pbc-form'))||{}}catch(e){return{}}})())};

const P=id=>players.find(p=>p.id===id);
const pname=id=>P(id)?P(id).name:'（已移除）';
const nm=id=>esc(pname(id));
const myP=()=>user?players.find(p=>p.user_id===user.id):null;
const isAdmin=()=>role==='owner'||role==='admin';
const sessById=id=>sessions.find(s=>s.id===id);
const isLive=s=>!!s&&!!s.cfg&&s.cfg.score==='live'&&s.status==='live';
const scoreOf=g=>liveEv[g.id]||[0,0];
function winner(s,x,y){const t=+((s.cfg||{}).target)||0;if(!t)return null;const w2=!!(s.cfg||{}).win2,cap=+((s.cfg||{}).cap)||0;
  if(cap){if(x>=cap&&x>y)return 'a';if(y>=cap&&y>x)return 'b'}
  if(x>=t&&x>y&&(!w2||x-y>=2))return 'a';if(y>=t&&y>x&&(!w2||y-x>=2))return 'b';return null}
const canScore=(g,s)=>{const me=myP();return !!user&&(isAdmin()||(s&&s.created_by===user.id)||!!(me&&sideOf(g,me.id)))};
const openRooms=()=>sessions.filter(s=>s.status!=='done');

/* ---------- 實力：加權 Ridge（得分比 logit，校正隊友與對手，起始分數當先驗，90 天半衰期） ---------- */
function invert(M){const n=M.length,a=M.map((r,i)=>[...r,...r.map((_,j)=>i===j?1:0)]);
  for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(a[r][c])>Math.abs(a[p][c]))p=r;[a[c],a[p]]=[a[p],a[c]];
    const d=a[c][c]||1e-9;for(let j=0;j<2*n;j++)a[c][j]/=d;
    for(let r=0;r<n;r++)if(r!==c){const f=a[r][c];if(f)for(let j=0;j<2*n;j++)a[r][j]-=f*a[c][j]}}
  return a.map(r=>r.slice(n))}
function ability(sport,onlySid,lam=3){
  const now=Date.now(),rows=[],cnt={},f=RS[sport];
  games.forEach(g=>{if(g.status!=='confirmed'||g.a.length!==g.b.length)return;const s=sessById(g.session_id);if(!s||s.sport!==sport||(onlySid&&s.id!==onlySid))return;
    const t=new Date(g.ended_at||s.started_at).getTime(),w=Math.pow(.5,Math.max(0,now-t)/864e5/90);
    rows.push({a:g.a,b:g.b,y:Math.log((g.sa+.5)/(g.sb+.5)),w});[...g.a,...g.b].forEach(id=>cnt[id]=(cnt[id]||0)+1)});
  const ids=Object.keys(cnt).filter(id=>P(id)),n=ids.length,ix={};if(!n)return{};ids.forEach((id,i)=>ix[id]=i);
  const base=3,b0=ids.map(()=>0);  // 每個人都從 3.000 起算
  const A=ids.map((_,i)=>ids.map((_,j)=>i===j?lam:0)),v=b0.map(x=>lam*x);
  rows.forEach(r=>{const xs=[...r.a.filter(id=>id in ix).map(id=>[ix[id],1]),...r.b.filter(id=>id in ix).map(id=>[ix[id],-1])];
    xs.forEach(([i,xi])=>{v[i]+=r.w*xi*r.y;xs.forEach(([j,xj])=>A[i][j]+=r.w*xi*xj)})});
  const inv=invert(A),beta=ids.map((_,i)=>inv[i].reduce((s,x,j)=>s+x*v[j],0));
  let rss=0,sw=0;rows.forEach(r=>{const p=r.a.reduce((s,id)=>s+(id in ix?beta[ix[id]]:0),0)-r.b.reduce((s,id)=>s+(id in ix?beta[ix[id]]:0),0);rss+=r.w*(r.y-p)*(r.y-p);sw+=r.w});
  const s2=Math.max(.25,sw>1?rss/sw:.25),out={};
  ids.forEach((id,i)=>out[id]={b:beta[i],sd:Math.sqrt(Math.max(0,inv[i][i]*s2)),g:cnt[id],r:base+RK*beta[i]});return out;
}

/* ---------- 排賽：出賽少的先上、上一輪休息的優先、避免重複搭檔/對手/同四人、兩隊實力接近 ---------- */
function counts(s,gl){
  const c={played:{},partner:{},opp:{},quad:{},lastSat:new Set()};
  gl.forEach(g=>{
    [...g.a,...g.b].forEach(id=>c.played[id]=(c.played[id]||0)+1);
    [g.a,g.b].forEach(t=>{if(t.length===2){const k=pk(t[0],t[1]);c.partner[k]=(c.partner[k]||0)+1}});
    g.a.forEach(x=>g.b.forEach(y=>{const k=pk(x,y);c.opp[k]=(c.opp[k]||0)+1}));
    const q=[...g.a,...g.b].sort().join('|');c.quad[q]=(c.quad[q]||0)+1;
  });
  const last=Math.max(0,...gl.map(g=>g.rn));
  if(last){const inLast=new Set(gl.filter(g=>g.rn===last).flatMap(g=>[...g.a,...g.b]));playing(s).forEach(id=>{if(!inLast.has(id))c.lastSat.add(id)})}
  return c;
}
function makeRound(s,gl,rn,R){
  const k=per(s),cu=courtsUsed(s);if(cu<1)return null;
  const c=counts(s,gl);
  const order=shuffle(playing(s)).sort((x,y)=>((c.played[x]||0)-(c.played[y]||0))||(c.lastSat.has(y)-c.lastSat.has(x)));
  const play=order.slice(0,cu*k);
  let best=null,bc=Infinity;
  for(let t=0;t<500;t++){
    const sh=shuffle(play),gs=[];let cost=0;
    for(let ci=0;ci<cu;ci++){
      const g=sh.slice(ci*k,ci*k+k),a=g.slice(0,k/2),b=g.slice(k/2);
      if(k===4){cost+=10*((c.partner[pk(a[0],a[1])]||0)+(c.partner[pk(b[0],b[1])]||0));cost+=6*(c.quad[[...a,...b].sort().join('|')]||0)}
      a.forEach(x=>b.forEach(y=>cost+=(k===4?2:5)*(c.opp[pk(x,y)]||0)));
      const d=a.reduce((x,id)=>x+R(id),0)-b.reduce((x,id)=>x+R(id),0);cost+=30*d*d;
      gs.push({a,b});
    }
    if(cost<bc){bc=cost;best=gs}
  }
  return best.map((g,i)=>({session_id:s.id,club_id:s.club_id,rn,court:i+1,a:g.a,b:g.b}));
}
async function genRounds(s,n,limit){
  if(UI.gen)return;const gl=gamesOf(s.id).slice(),AB=ability(s.sport),R=id=>AB[id]?AB[id].b:0;
  let rn=Math.max(0,...gl.map(g=>g.rn));const rows=[];
  for(let i=0;i<n;i++){const r=makeRound(s,gl,++rn,R);if(!r)break;rows.push(...r);gl.push(...r)}
  if(limit>0&&rows.length>limit)rows.length=limit;
  if(!rows.length){toast('房內人數不夠排一場');return}
  UI.gen=true;const {error}=await sb.from('games').insert(rows);UI.gen=false;
  if(error&&error.code!=='23505')toast(errMsg(error));
  await loadClub();
}

/* ---------- 01 大廳 ---------- */
function myGames(sport){const me=myP();if(!me)return[];
  return games.filter(g=>g.status==='confirmed'&&[...g.a,...g.b].includes(me.id)&&(!sport||(sessById(g.session_id)||{}).sport===sport))
    .sort((x,y)=>new Date(y.ended_at||y.created_at)-new Date(x.ended_at||x.created_at))}
function gameLine(g){const me=myP(),side=sideOf(g,me.id),s=sessById(g.session_id)||{sport:'pickleball',cfg:{}},my=side==='a'?g.sa:g.sb,op=side==='a'?g.sb:g.sa,w=my>op;
  const mate=(side==='a'?g.a:g.b).filter(id=>id!==me.id),opp=side==='a'?g.b:g.a,d=new Date(g.ended_at||g.created_at);
  return `<div class="item"><div class="grow"><b>${SP[s.sport]}${(g.a.length===2?'雙打':'單打')}</b><small>${d.getMonth()+1}/${d.getDate()}${mate.length?'・搭檔 '+mate.map(nm).join('、'):''}・對手 ${opp.map(nm).join('、')}</small></div><span class="wl ${w?'w':'l'}">${w?'勝':'負'} ${my}–${op}</span></div>`}
function vToday(){

  const A={pickleball:ability('pickleball'),badminton:ability('badminton')},rt=sp=>A[sp][mid]?A[sp][mid].r.toFixed(3):'未定級';
  const recent=myGames().slice(0,3);
  return `<h1>大廳</h1><p class="sub">今天想打一場嗎？</p>
  <div class="hero">${figure(avOf(user.id),f.sport)}<div class="who"><b>${esc(me.name)}<span class="lv">Lv.${lvOf(mid)}</span></b><span class="mute">你的球場，準備就緒</span></div>
    <div class="stats"><div class="chip">匹克球<b>${rt('pickleball')}</b></div><div class="chip">羽球<b>${rt('badminton')}</b></div></div></div>
  ${pendingCard()}
  ${cur?`<button class="btn pri wide" data-act="enter" data-id="${cur.id}" style="margin-bottom:10px">回到房間<small>${esc(roomName(cur))}・${cur.status==='live'?'比賽中':'等待中'}</small></button>`:''}
  <div class="row2"><button class="btn ${cur?'':'pri'}" data-act="newRoom">建立房間</button><button class="btn" data-act="joinAsk">加入房間</button></div>
  ${rs.length?`<h2>開著的房間</h2>${rs.map(x=>{const n=playing(x).length,mine=inRoom(x,mid);
    return `<div class="card ${mine?'hl':''}"><div class="split"><div style="min-width:0"><b>${esc(roomName(x))}</b> ${sportPill(x)} ${x.status==='live'?'<span class="pill live">比賽中</span>':'<span class="pill y">等待中</span>'}${amHost(x)&&(x.pending||[]).length?' <span class="pill live">'+(x.pending||[]).length+' 人申請</span>':''}
      <div class="mute" style="font-size:13px">${x.code?'代碼 '+esc(x.code)+'・':''}${n} 人・${modeTxt(x)}・${ruleTxt(x)}</div><div class="heads" style="margin-top:6px">${playing(x).slice(0,8).map(id=>headImg(id)).join('')}</div></div>
      ${mine?`<button class="btn sm pri" data-act="enter" data-id="${x.id}">進入</button>`:(isPend(x,mid)?`<button class="btn sm" data-act="rcancel" data-id="${x.id}">取消申請</button>`:`<button class="btn sm" data-act="rjoin" data-id="${x.id}">${amHost(x)||(x.present||[]).includes(mid)?'加入':'申請加入'}</button>`)}</div>${isPend(x,mid)?`<div class="pendbar">⏳ 已送出申請，等房主同意中…</div>`:''}</div>`}).join('')}`:''}
  <h2>近期戰績</h2><div class="card">${recent.length?recent.map(gameLine).join(''):'<p class="empty">還沒有正式戰績，開一場吧！</p>'}</div>`;
}

/* ---------- 02 開房設定 ---------- */

  ${[['live','即時逐分計分','場上球員與管理員可即時記分'],['final','打完填比分','打完後輸入雙方比分']].map(([k,l,d])=>`<button class="opt ${(f.score||'final')===k?'on':''}" data-act="fScore" data-v="${k}"><span class="dot"></span><span><b>${l}</b><small>${d}</small></span></button>`).join('')}

  ${f.sport==='pickleball'?`<label class="lb">計分制</label>${seg(f.serve||'rally','fServe',[['rally','落地得分'],['side','發球得分']])}`:''}
  <label class="lb" for="durSel">場地時間</label>

/* ---------- 03 等待／04 比賽中 ---------- */
const isPend=(s,pid)=>!!pid&&(s.pending||[]).includes(pid);
const amHost=s=>!!(s&&user&&s.created_by===user.id);
// 非房內的人看到的加入按鈕：房主直接進；其他人申請，申請中可取消
function joinBtn(s,mid,cls){
  if(isPend(s,mid))return `<button class="btn ${cls||''}" data-act="rcancel" data-id="${s.id}">等房主同意中・取消申請</button>`;
  const back=(s.present||[]).includes(mid);
  return `<button class="btn ${cls||'pri'}" data-act="rjoin" data-id="${s.id}">${back?'回到場上':amHost(s)?'加入房間':'申請加入'}</button>`}
// 房主：加入申請＋直接加人
function reqCard(s){if(!amHost(s))return '';const pd=(s.pending||[]).filter(P);
  return pd.length?`<div class="card hl"><div class="split"><b>加入申請（${pd.length}）</b><small class="mute">你同意了才會進房</small></div>
  ${pd.map(id=>`<div class="item">${headImg(id,'s')}<div class="grow"><b>${nm(id)}</b><small>想加入這個房間</small></div><button class="btn sm pri" data-act="rAdmit" data-id="${id}">同意</button><button class="btn sm" data-act="rReject" data-id="${id}">拒絕</button></div>`).join('')}</div>`:''}
const addBtn=s=>amHost(s)?`<button class="btn wide" data-act="addAsk" style="margin-top:10px">＋ 直接把人加進房間</button>`:'';
async function joinRoom(sid){
  const res=await rpc('room_join',{sid});
  if(res==='pending'){UI.pendRoom=sid;await loadClub();toast('已送出申請，等房主按同意');return}
  setRoom(sid);UI.game=null;go('games');await loadClub();
  const x=sessById(sid);if(x&&x.status==='live')toast(isHost(x)?'已加入；可在房主設定按「重排」把新的人排進去':'已回到房間');else toast('已進入房間')}
function vRoom(){
  const s=room();
  if(UI.game){const g=games.find(x=>x.id===UI.game);if(g)return vGame(g,sessById(g.session_id));UI.game=null}
  if(!s)return `<h1>房間</h1><div class="card"><p class="empty">你還沒進入任何房間。</p><button class="btn pri wide" data-tab="today">回到大廳</button></div>`;
  return s.status==='lobby'?vWait(s):vPlay(s);
}
function vWait(s){
  const me=myP(),mid=me&&me.id,host=isHost(s),k=per(s),ids=(s.present||[]).filter(P),rd=s.ready||[],nr=ids.filter(id=>rd.includes(id)).length,inR=inRoom(s,mid);
  const hostP=players.find(x=>x.user_id===s.created_by);
  return `<button class="btn sm ghost" data-tab="today">‹ 大廳</button>
  <h1 style="margin-top:10px">房間等待中</h1><p class="sub">${esc(roomName(s))}・${modeTxt(s)}・${ruleTxt(s)}</p>
  <div class="card split"><div><small class="mute">房間代碼</small><div class="code">${esc(s.code||'——')}</div></div><button class="btn sm" data-act="copyCode" data-id="${s.id}">複製代碼</button></div>
  ${reqCard(s)}
  <div class="card"><div class="split"><h3 style="margin:0">球員（${ids.length}）</h3><span class="pill ${nr===ids.length&&ids.length?'ok':''}">${nr} / ${ids.length} 人已準備</span></div>
    ${ids.map(id=>{const r=rd.includes(id),off=(s.away||[]).includes(id);return `<div class="item" style="${off?'opacity:.5':''}">${headImg(id)}<div class="grow"><b>${nm(id)}${hostP&&hostP.id===id?' 👑':''}${id===mid?'（我）':''}</b>${off?'<small>先離開</small>':''}</div>
      <span class="pill ${r?'ok':''}">${r?'已準備':'未準備'}</span>${host&&id!==mid?`<button class="kick" data-act="kick" data-id="${id}" aria-label="請 ${nm(id)} 離開">×</button>`:''}</div>`}).join('')||'<p class="empty">還沒有人進來</p>'}
    ${ids.length<k?`<p class="mute" style="margin:8px 0 0">還差 ${k-ids.length} 人才能開始${k===4?'雙打':'單打'}。</p>`:''}${addBtn(s)}</div>
  <div class="row2">${me?(inR?`<button class="btn" data-act="ready" data-v="${rd.includes(mid)?0:1}">${rd.includes(mid)?'取消準備':'我準備好了'}</button><button class="btn ghost" data-act="rleave" data-id="${s.id}">離開房間</button>`
    :joinBtn(s,mid)+'<span></span>'):''}</div>
  <button class="btn wide" data-act="copyRoom" data-id="${s.id}" style="margin-top:10px">邀請球友（複製連結）</button>
  ${host?`<label class="lb" for="rGamesSel">今天打幾場</label>${gamesSelect('rGamesSel',s.cfg&&s.cfg.games,estRounds(Object.assign({sport:s.sport},s.cfg))*Math.max(1,courtsUsed(s)))}
  <details class="more"><summary>房主設定</summary><label class="lb">場地數</label>${seg((s.cfg&&s.cfg.courts)||1,'rCourts',[[1,'1 面'],[2,'2 面'],[3,'3 面'],[4,'4 面']])}
    <button class="btn warn wide" data-act="rcloseAsk" style="margin-top:14px">解散房間</button></details>
  <div class="foot"><button class="btn pri wide" data-act="rstart" ${ids.length<k?'disabled':''}>${ids.length<k?`還差 ${k-ids.length} 人`:'開始比賽'}<small>${ids.length>=k?`不用等全員準備・排 ${planGames(s)} 場`:'人數不夠'}</small></button></div>`
  :`<p class="mute" style="text-align:center;margin-top:14px">等待房主 ${esc(hostP?hostP.name:'')} 開始比賽…</p>`}`;
}
function vPlay(s){
  const me=myP(),mid=me&&me.id,host=isHost(s),gl=gamesOf(s.id),on=onCourt(s),q=queued(s),rec=nextRec(s),busy=busyIds(s),fc=freeCourts(s),inR=inRoom(s,mid);
  const waitIds=playing(s).filter(id=>!busy.has(id)),done=gl.filter(g=>g.status!=='open').reverse();
  const startBtn=g=>host?`<button class="btn sm ${g===rec?'pri':''}" data-act="gStart" data-id="${g.id}" ${!fc||[...g.a,...g.b].some(id=>busy.has(id))?'disabled':''}>開始這場</button>`:'';
  return `<button class="btn sm ghost" data-tab="today">‹ 大廳</button>
  <h1 style="margin-top:10px">房間比賽中</h1><p class="sub">${esc(roomName(s))}・${modeTxt(s)}・${ruleTxt(s)}・${s.cfg.score==='live'?'即時計分':'打完填比分'}${s.code?'・代碼 '+esc(s.code):''}</p>
  <p style="margin:-6px 0 12px"><span class="pill y">已打 ${done.length} 場${(s.cfg&&+s.cfg.games)?` / 今天 ${+s.cfg.games} 場`:''}・還有 ${q.length+on.length} 場</span></p>
  ${reqCard(s)}
  ${pendingCard()}
  ${!on.length&&!q.length&&done.length?`<div class="card hl" style="text-align:center"><h3 style="margin:0 0 4px">🎉 今天排的 ${done.length} 場都打完了</h3>
    ${host?`<p class="mute" style="margin:0 0 12px">要收工就結束活動；還想打，就再加一輪。</p><div class="row2"><button class="btn pri" data-act="endAsk">結束今天的活動</button><button class="btn" data-act="addRound">再加一輪</button></div>`:'<p class="mute" style="margin:0">等房主結束今天的活動。</p>'}</div>`:''}
  <h2>場上對戰${on.length?`（${on.length}／${(s.cfg&&s.cfg.courts)||1} 面）`:''}</h2>
  ${on.length?on.map(g=>{const sc=s.cfg.score==='live'?scoreOf(g).join(' – '):'';return `<div class="card hl"><div class="split" style="margin-bottom:8px"><b>第 ${seqOf(g,s)} 場</b><span class="pill live">正在對戰</span></div>${matchRow(g,s,mid,sc)}
    <div class="row2" style="margin-top:12px"><button class="btn pri" data-act="openGame" data-id="${g.id}">${s.cfg.score==='live'?'前往即時計分':'填比分'}</button>${host?`<button class="btn ghost" data-act="gStop" data-id="${g.id}">取消開打</button>`:'<span></span>'}</div></div>`}).join('')
    :`<div class="card"><p class="empty">目前沒有正在進行的比賽${host&&rec?'，從下方挑一組開始':''}。</p></div>`}
  ${rec?`<h2>建議下一場</h2><div class="card hl"><div class="split" style="margin-bottom:8px"><b>第 ${seqOf(rec,s)} 場</b>${fc?'<span class="pill y">有空場地</span>':'<span class="pill">等場地空出</span>'}</div>${matchRow(rec,s,mid)}
    ${host?`<button class="btn pri wide" style="margin-top:12px" data-act="gStart" data-id="${rec.id}" ${fc?'':'disabled'}>${fc?'開始這場':'場地都在使用中'}</button>`:''}</div>`:''}
  <h2>賽程（還有 ${q.length} 場）</h2><div class="card">${q.length?q.map(g=>`<div class="item"><span class="qn">#${seqOf(g,s)}</span><div class="grow"><b>${teamNames(g.a,mid)}</b><small>vs ${teamNames(g.b,mid)}${[...g.a,...g.b].some(id=>busy.has(id))?'・有人在場上':''}</small></div>${g===rec?'<span class="pill y">建議</span>':''}${startBtn(g)}</div>`).join('')
    :`<p class="empty">預排的場次打完了</p>${host?'<button class="btn wide" data-act="addRound">再排一輪</button>':''}`}</div>
  <h2>候場</h2><div class="card">${waitIds.length?`<div class="row">${waitIds.map(id=>`<span class="pill">${nm(id)}</span>`).join('')}</div>`:'<p class="empty" style="padding:6px">目前無候場球員</p>'}</div>
  ${done.length?`<h2>已打完（${done.length}）</h2><div class="card">${done.map(g=>`<button class="item" style="width:100%;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer;text-align:left" data-act="openGame" data-id="${g.id}"><span class="qn">#${seqOf(g,s)}</span><div class="grow"><b>${teamNames(g.a,mid)} vs ${teamNames(g.b,mid)}</b><small>${g.status==='pending'?'待確認':'已確認'}</small></div><span class="num" style="font-weight:800">${g.sa}–${g.sb}</span></button>`).join('')}</div>`:''}
  <div class="row2" style="margin-top:14px">${me?(inR?`<button class="btn ghost" data-act="rleave" data-id="${s.id}">我先離開</button>`:joinBtn(s,mid,' ')):''}<button class="btn" data-act="copyRoom" data-id="${s.id}">邀請球友</button></div>
  ${host?`<details class="more"><summary>房主設定</summary>
    <label class="lb">場地數</label>${seg((s.cfg&&s.cfg.courts)||1,'rCourts',[[1,'1 面'],[2,'2 面'],[3,'3 面'],[4,'4 面']])}
    <label class="lb">房內球員</label>${(s.present||[]).filter(P).map(id=>{const off=(s.away||[]).includes(id);return `<div class="item">${headImg(id,'s')}<div class="grow"><b>${nm(id)}</b><small>${off?'先離開':'在場'}</small></div>${id!==mid?`<button class="btn sm" data-act="kick" data-id="${id}">${off?'回到場上':'先離開'}</button>`:''}</div>`}).join('')}${addBtn(s)}

/* ---------- 05 即時計分／06 填比分與確認 ---------- */
function vGame(g,s){

    <p class="sub">${s?esc(roomName(s))+'・':''}第 ${seq} 場・${s?modeTxt(s)+'・'+ruleTxt(s):''}</p>`;
  if(g.status==='open'&&!g.started_at&&!ed)return head+`<div class="card">${matchRow(g,s,mid)}<p class="empty">這場還沒開始。</p>${host?`<button class="btn pri wide" data-act="gStart" data-id="${g.id}" ${freeCourts(s)?'':'disabled'}>開始這場</button>`:''}</div>`;
  if(g.status==='open'&&live&&!ed){const [x,y]=scoreOf(g),w=winner(s,x,y);
    return head+`<div class="split" style="margin-bottom:8px"><b>場上比分</b><span class="sync ${online?'':'off'}">${online?'已同步':'連線中斷，恢復後會補送'}</span></div>
    <div class="board"><div class="side a"><span class="lab">A 隊</span><div class="score" aria-live="polite" aria-label="A 隊 ${x} 分">${x}</div><small>${teamNames(g.a,mid)}</small>
      ${cs?`<button class="plus a" data-act="pt" data-id="${g.id}" data-v="a" aria-label="A 隊得 1 分">A +1</button>`:''}</div>
      <div class="side b"><span class="lab">B 隊</span><div class="score" aria-live="polite" aria-label="B 隊 ${y} 分">${y}</div><small>${teamNames(g.b,mid)}</small>
      ${cs?`<button class="plus b" data-act="pt" data-id="${g.id}" data-v="b" aria-label="B 隊得 1 分">B +1</button>`:''}</div></div>
    ${cs?`<button class="btn wide" style="margin-top:10px" data-act="ptUndo" data-id="${g.id}" ${x+y?'':'disabled'}>↶ 復原上一分</button>
      <details class="more"><summary>計分選項</summary><div class="row2"><button class="btn" data-act="toManualAsk" data-id="${g.id}">改手動填分</button><button class="btn" data-act="earlyAsk" data-id="${g.id}" ${x!==y?'':'disabled'}>提前結束</button></div></details>
      <p class="mute" style="text-align:center;margin:14px 0 0">${w?`🏆 ${w==='a'?'A':'B'} 隊拿下這場，送出後由對手確認。`:'符合勝利條件後，即可送交對手確認。'}</p>
      <div class="foot"><button class="btn pri wide" data-act="lvSubmit" data-id="${g.id}" ${w?'':'disabled'}>${w?`送出比分 ${x}:${y}`:'尚未達到勝利條件'}</button></div>`
    :'<p class="mute" style="text-align:center;margin-top:14px">由場上球員、房主或團長／幹部記分。</p>'}`}
  if(g.status==='open'||ed){const pa=UI.fill&&UI.fill.id===g.id?UI.fill:{id:g.id,x:ed&&g.sa!=null?g.sa:'',y:ed&&g.sb!=null?g.sb:''};UI.fill=pa;
    const x=parseInt(pa.x),y=parseInt(pa.y),okN=!isNaN(x)&&!isNaN(y),w=okN&&s?winner(s,x,y):null;
    return head+`<div class="card">${matchRow(g,s,mid)}</div><h2>填寫完場比分</h2>

      <div><label class="lb" for="xb" style="color:var(--b);text-align:center">B 隊</label><input type="number" inputmode="numeric" id="xb" min="0" max="99" value="${esc(pa.y)}" aria-label="B 隊分數"></div></div>
    <div class="res" id="resTxt">${okN?(x===y?'比分不能平手':`${x>y?'A':'B'} 隊獲勝<small>${w?'符合勝利條件':'未達勝利條件（時間到可照樣送出）'}</small>`):'<small>輸入兩隊分數</small>'}</div>

/* ---------- 07 排名 ---------- */
function statsOf(gl){
  const ps={};
  gl.forEach(g=>[['a','b'],['b','a']].forEach(([m,o])=>{const my=g['s'+m],ot=g['s'+o],win=my>ot;
    g[m].forEach(id=>{const x=ps[id]||(ps[id]={id,g:0,w:0,l:0,pf:0,pa:0});x.g++;win?x.w++:x.l++;x.pf+=my;x.pa+=ot})}));
  return Object.values(ps).filter(x=>P(x.id)).sort((x,y)=>(y.w/y.g-x.w/x.g)||(y.w-x.w)||((y.pf-y.pa)-(x.pf-x.pa)));
}
const meRow=id=>{const m=myP();return m&&m.id===id?'me':''};
function vRank(){
  const sp=UI.rankSport,AB=ability(sp),me=myP(),ps=players.filter(p=>!p.hidden);
  const rated=ps.filter(p=>AB[p.id]).sort((x,y)=>AB[y.id].r-AB[x.id].r),un=ps.filter(p=>!AB[p.id]);
  const rel=v=>v.sd<.13?'穩定':v.sd<.2?'普通':'參考';
  return `<h1>排行榜</h1><p class="sub">${esc(club.name)}・生涯</p>${seg(sp,'rs',[['pickleball','匹克球'],['badminton','羽球']])}
  <h2>球員排名</h2><div class="card">${rated.map((p,i)=>{const v=AB[p.id];return `<div class="item ${i===0?'r1':''} ${meRow(p.id)}"><span class="rk">${String(i+1).padStart(2,'0')}</span>${headImg(p.id)}<div class="grow"><b>${esc(p.name)}</b><small>${v.g} 場・可信度${rel(v)}</small></div><span class="num" style="font-weight:800;font-size:18px">${v.r.toFixed(3)}</span></div>`}).join('')}
    ${un.map(p=>`<div class="item ${meRow(p.id)}"><span class="rk">—</span>${headImg(p.id)}<div class="grow"><b>${esc(p.name)}</b><small>0 場</small></div><span class="mute">未定級</span></div>`).join('')}
    ${!ps.length?'<p class="empty">還沒有球員</p>':''}</div>
  <p class="mute" style="font-size:13px">分數仿 DUPR 尺度，每個人第一場都從 3.000 開始算；會校正隊友與對手的強弱。這是球團自己的分數，不是官方 DUPR。</p>`;
}

function report(s){
  const gl=gamesOf(s.id).filter(g=>g.status==='confirmed'),st=statsOf(gl),AB=ability(s.sport,s.id);

let needR=false;
function soft(){const a=document.activeElement;if(a&&a.matches('input,textarea,select')&&$('#view').contains(a)){needR=true;return}render()}
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(needR&&!(a&&a.matches('input,select')&&$('#view').contains(a))){needR=false;render()}},0));
// 被房主移出：本來在房間裡，同步後名單沒有自己 → 回大廳並提示
function checkKicked(){
  if(UI.view!=='club'||!club)return;const me=myP();if(!me)return;
  // 申請者：房主同意 → 自動進房；拒絕 → 提示
  if(!UI.pendRoom){const pr=openRooms().find(x=>isPend(x,me.id));if(pr)UI.pendRoom=pr.id}
  if(UI.pendRoom){const pr=sessById(UI.pendRoom);
    if(!pr||pr.status==='done'){UI.pendRoom=null}
    else if(inRoom(pr,me.id)){UI.pendRoom=null;setRoom(pr.id);UI.game=null;UI.tab='games';UI.wasIn=pr.id;setTimeout(()=>toast('房主同意了，歡迎進房！'),50)}
    else if(!isPend(pr,me.id)){UI.pendRoom=null;setTimeout(()=>toast('房主這次沒有同意你加入「'+roomName(pr)+'」'),50)}}
  // 房主：有新的加入申請 → 提示
  const mine=openRooms().filter(amHost),pc=mine.reduce((n,x)=>n+(x.pending||[]).length,0);
  if(UI.pendSeen!=null&&pc>UI.pendSeen){const x=mine.find(r=>(r.pending||[]).length),last=x&&x.pending[x.pending.length-1];setTimeout(()=>toast((last?nm(last):'有人')+' 想加入你的房間'),50)}
  UI.pendSeen=pc;
  const s=UI.room?sessById(UI.room):null;
  if(s&&s.status!=='done'&&inRoom(s,me.id)){UI.wasIn=s.id;return}
  if(!UI.wasIn)return;const w=sessById(UI.wasIn);UI.wasIn=null;
  if(!w||w.status==='done'||inRoom(w,me.id))return;
  setRoom(null);UI.game=null;if(UI.tab==='games')UI.tab='today';
  setTimeout(()=>toast(w.status==='lobby'?'房主把你移出了「'+roomName(w)+'」':'房主把你標記為離場，暫時不會排到你'),50);
}

  checkKicked();

  if(v==='setup')html=vSetup();else if(v==='login')html=vLogin();else if(v==='nick')html=vNick();else if(v==='clubs')html=vClubs();
  else if(v==='club'&&club){html=({today:vToday,games:vRoom,create:vCreate,rank:vRank,records:vRecords,members:vMembers,avatar:vAvatar}[UI.tab]||vToday)()}
  else html=`<div class="empty">載入中…</div>`;
  $('#view').innerHTML=html;
  const inClub=v==='club'&&club;document.body.classList.toggle('nonav',!inClub);
  $('#sub').textContent=inClub?club.name:'匹克球・羽球計分';

if(!SUPABASE_URL||!SUPABASE_KEY||!window.supabase){UI.view='setup';render()}
else{
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:TESTN?{persistSession:true,detectSessionInUrl:false,storage:window.sessionStorage,storageKey:'ps-test-'+TESTN}:{persistSession:true,detectSessionInUrl:true,flowType:'pkce'}});
  let booted=false;
  sb.auth.onAuthStateChange((ev,session)=>{const u=session?session.user:null;
    if(!booted||(u&&u.id)!==(user&&user.id)){booted=true;user=u;setTimeout(afterAuth,0)}});
}
}
</script>
